[content_type]
name = "Example"
singular = "example"
plural = "examples"
table = "examples"
description = "Example content type"
timestamps = true
soft_delete = false

[fields.name]
type = "text"
required = true
max_length = 200
label = "name"

[fields.status]
type = "enum"
enum_values = ["active", "inactive"]
default = "active"
label = "state"

[api]
list = "public"
get = "public"
create = "admin"
update = "admin"
delete = "admin"
