[content_type]
name = "Tag"
singular = "tag"
plural = "tags"
table = "tags"
description = "Article tags"
implements = ["ownable", "timestampable"]

[fields.name]
type = "text"
required = true
max_length = 50
unique = true
label = "Tag name"

[fields.slug]
type = "uid"
target_field = "name"
unique = true

[[indexes]]
fields = ["slug"]
unique = true

[api.list]
access = "public"

[api.get]
access = "public"

[api.create]
access = "admin"

[api.update]
access = "admin"

[api.delete]
access = "admin"
