[plugin]
id = "com.axe.seo-rhai"
name = "SEO Optimizer (Rhai)"
version = "1.0.0"
description = "Rhai plug-in engine verification: automatically generate SEO meta, HTML injection, cache preheating, statistical routing"
author = "axe"
license = "MIT"
runtime = "rhai"
language = "rhai"
entry = "init.rhai"

[permissions]
config = ["app.*", "seo.*"]
database = ["read:posts"]
filesystem = ["read-write"]
max_memory_mb = 8
timeout_ms = 3000

[hooks.on-post-creating]
priority = 10

[hooks.on-post-created]
priority = 10

[hooks.render-markdown]
priority = 5

[[routes]]
method = "GET"
path = "/api/v1/plugins/seo/stats"
handler = "seo_stats"

[[routes]]
method = "GET"
path = "/api/v1/plugins/seo/health"
handler = "seo_health"
