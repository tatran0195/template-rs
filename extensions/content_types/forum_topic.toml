[content_type]
name = "Forum Topic"
singular = "forum_topic"
plural = "forum_topics"
table = "forum_topics"
description = "Forum topic"
implements = ["ownable", "timestampable"]
slug_field = "title"

[fields.title]
type = "text"
required = true
max_length = 200
label = "title"

[fields.slug]
type = "uid"
target_field = "title"
unique = true
label = "URL identifier"

[fields.content]
type = "richtext"
required = true
label = "text"

[fields.board]
type = "relation"
relation_type = "many_to_one"
target = "forum_boards"
foreign_key = "board_id"
required = true
label = "Section to which it belongs"

[fields.author_id]
type = "text"
required = true
label = "Posted by"

[fields.reply_count]
type = "integer"
default = 0
private = true
label = "Number of replies"

[fields.view_count]
type = "integer"
default = 0
private = true
label = "Views"

[fields.last_reply_at]
type = "datetime"
label = "Last reply time"

[fields.last_reply_user_id]
type = "text"
label = "last reply person"

[fields.is_pinned]
type = "boolean"
default = false
label = "pin to top"

[fields.is_locked]
type = "boolean"
default = false
label = "locking"

[fields.is_solved]
type = "boolean"
default = false
label = "Resolved"

[fields.tags]
type = "text"
max_length = 200
label = "Label"

[[indexes]]
fields = ["slug"]
unique = true

[[indexes]]
fields = ["board_id", "is_pinned", "last_reply_at"]

[[indexes]]
fields = ["author_id", "created_at"]

[list_view]
default_sort = "is_pinned:desc,last_reply_at:desc"
columns = ["title", "board", "author_id", "reply_count", "view_count", "is_pinned", "is_locked", "last_reply_at"]

[api.list]
access = "public"
cache = true

[api.get]
access = "public"
cache = false

[api.create]
access = "member"

[api.update]
access = "member"
filter = "@request.auth.id == author_id || @request.auth.role == 'admin'"

[api.delete]
access = "member"
filter = "@request.auth.id == author_id || @request.auth.role == 'admin'"
