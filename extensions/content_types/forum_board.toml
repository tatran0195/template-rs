[content_type]
name = "Forum Board"
singular = "forum_board"
plural = "forum_boards"
table = "forum_boards"
description = "Forum section"
implements = ["ownable", "timestampable"]
slug_field = "name"

[fields.name]
type = "text"
required = true
max_length = 100
label = "Section name"

[fields.slug]
type = "uid"
target_field = "name"
unique = true
label = "URL identifier"

[fields.description]
type = "text"
max_length = 500
label = "Section description"

[fields.icon]
type = "media"
accept = ["image/*"]
max_count = 1
label = "Section icon"

[fields.parent]
type = "relation"
relation_type = "many_to_one"
target = "forum_boards"
foreign_key = "parent_id"
label = "Parent section"

[fields.sort_order]
type = "integer"
default = 0
min = 0
label = "Sorting weight"

[fields.topic_count]
type = "integer"
default = 0
private = true
label = "Number of topics"

[fields.post_count]
type = "integer"
default = 0
private = true
label = "Number of posts"

[fields.last_activity_at]
type = "datetime"
label = "Last active time"

[fields.last_topic_id]
type = "text"
label = "last topic id"

[[indexes]]
fields = ["slug"]
unique = true

[[indexes]]
fields = ["parent_id", "sort_order"]

[list_view]
default_sort = "sort_order:asc"
columns = ["name", "slug", "topic_count", "post_count", "last_activity_at"]

[api.list]
access = "public"
cache = true

[api.get]
access = "public"
cache = true

[api.create]
access = "admin"

[api.update]
access = "admin"

[api.delete]
access = "admin"
