[content_type]
name = "Contact"
singular = "contact"
plural = "contacts"
table = "crm_contacts"
description = "Contact person"
implements = ["ownable", "timestampable"]

[fields.first_name]
type = "text"
required = true
max_length = 100
label = "name"

[fields.last_name]
type = "text"
required = true
max_length = 100
label = "surname"

[fields.email]
type = "email"
required = true
unique = true
label = "Mail"

[fields.phone]
type = "text"
label = "Telephone"

[fields.mobile]
type = "text"
label = "cell phone"

[fields.job_title]
type = "text"
label = "Position"

[fields.company]
type = "relation"
relation_type = "many_to_one"
target = "companies"
foreign_key = "company_id"
label = "Company"

[fields.source]
type = "enum"
enum_values = ["website", "referral", "linkedin", "cold_call", "event", "advertisement", "other"]
default = "other"
label = "Source channel"

[fields.status]
type = "enum"
enum_values = ["active", "inactive", "converted", "churned"]
default = "active"
label = "state"

[fields.lifecycle_stage]
type = "enum"
enum_values = ["subscriber", "lead", "marketing_qualified_lead", "sales_qualified_lead", "opportunity", "customer", "evangelist"]
default = "lead"
label = "life cycle stage"

[fields.owner_id]
type = "text"
label = "person in charge"

[fields.notes]
type = "richtext"
label = "Remark"

[[indexes]]
fields = ["email"]
unique = true

[[indexes]]
fields = ["company_id"]

[[indexes]]
fields = ["owner_id", "created_at"]

[[indexes]]
fields = ["status"]

[[indexes]]
fields = ["lifecycle_stage"]

[list_view]
default_sort = "created_at:desc"
columns = ["first_name", "last_name", "email", "company", "job_title", "status", "lifecycle_stage", "owner_id"]

[api.list]
access = "member"

[api.get]
access = "member"

[api.create]
access = "member"

[api.update]
access = "member"
filter = "@request.auth.id == owner_id || @request.auth.role == 'admin'"

[api.delete]
access = "admin"
