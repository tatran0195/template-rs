[content_type]
name = "Forum Reply"
singular = "forum_reply"
plural = "forum_replies"
table = "forum_replies"
description = "Forum reply"
implements = ["ownable", "timestampable"]

[fields.content]
type = "richtext"
required = true
label = "Reply content"

[fields.topic]
type = "relation"
relation_type = "many_to_one"
target = "forum_topics"
foreign_key = "topic_id"
required = true
immutable = true
label = "Topic"

[fields.author_id]
type = "text"
required = true
immutable = true
label = "Respondent"

[fields.parent_reply]
type = "relation"
relation_type = "many_to_one"
target = "forum_replies"
foreign_key = "parent_reply_id"
immutable = true
label = "parent reply"

[fields.is_answer]
type = "boolean"
default = false
label = "Best answer"

[fields.vote_count]
type = "integer"
default = 0
private = true
label = "Number of votes"

[[indexes]]
fields = ["topic_id", "created_at"]

[[indexes]]
fields = ["author_id", "created_at"]

[list_view]
default_sort = "created_at:asc"
columns = ["topic", "author_id", "vote_count", "is_answer", "created_at"]

[api.list]
access = "public"
cache = true

[api.get]
access = "public"
cache = true

[api.create]
access = "member"

[api.update]
access = "member"
filter = "@request.auth.id == author_id || @request.auth.role == 'admin'"

[api.delete]
access = "member"
filter = "@request.auth.id == author_id || @request.auth.role == 'admin'"
