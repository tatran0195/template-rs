[content_type]
name = "Forum Vote"
singular = "forum_vote"
plural = "forum_votes"
table = "forum_votes"
description = "Forum voting records"
implements = ["ownable", "timestampable"]

[fields.target_type]
type = "text"
required = true
max_length = 10
immutable = true
label = "target type"

[fields.target_id]
type = "text"
required = true
immutable = true
label = "Target ID"

[fields.user_id]
type = "text"
required = true
immutable = true
label = "voting user"

[fields.value]
type = "integer"
required = true
min = -1
max = 1
default = 1
label = "vote value"

[[indexes]]
fields = ["target_type", "target_id", "user_id"]
unique = true

[[indexes]]
fields = ["target_id", "created_at"]

[list_view]
default_sort = "created_at:desc"
columns = ["target_type", "target_id", "user_id", "value", "created_at"]

[api.list]
access = "admin"
cache = true

[api.get]
access = "admin"
cache = true

[api.create]
access = "admin"

[api.update]
access = "admin"

[api.delete]
access = "admin"
