[content_type]
name = "Company"
singular = "company"
plural = "companies"
table = "crm_companies"
description = "Company/Organization"
implements = ["ownable", "timestampable"]

[fields.name]
type = "text"
required = true
max_length = 200
label = "Company Name"

[fields.website]
type = "text"
label = "website"

[fields.industry]
type = "enum"
enum_values = ["technology", "finance", "healthcare", "education", "retail", "manufacturing", "real_estate", "consulting", "media", "other"]
default = "other"
label = "industry"

[fields.size]
type = "enum"
enum_values = ["1-10", "11-50", "51-200", "201-500", "501-1000", "1000+"]
default = "1-10"
label = "Company size"

[fields.phone]
type = "text"
label = "Telephone"

[fields.address]
type = "text"
label = "address"

[fields.city]
type = "text"
label = "City"

[fields.country]
type = "text"
default = "CN"
label = "nation"

[fields.description]
type = "richtext"
label = "Company Profile"

[fields.owner_id]
type = "text"
label = "person in charge"

[[indexes]]
fields = ["name"]

[[indexes]]
fields = ["industry"]

[[indexes]]
fields = ["owner_id", "created_at"]

[list_view]
default_sort = "created_at:desc"
columns = ["name", "industry", "size", "city", "owner_id", "created_at"]

[api.list]
access = "member"

[api.get]
access = "member"

[api.create]
access = "member"

[api.update]
access = "member"
filter = "@request.auth.id == owner_id || @request.auth.role == 'admin'"

[api.delete]
access = "admin"
