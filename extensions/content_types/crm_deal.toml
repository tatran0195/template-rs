[content_type]
name = "Deal"
singular = "deal"
plural = "deals"
table = "crm_deals"
description = "Business/Sales Opportunities"
implements = ["ownable", "timestampable"]

[fields.title]
type = "text"
required = true
max_length = 300
label = "Opportunity name"

[fields.amount]
type = "decimal"
min = 0
default = 0
label = "Amount"

[fields.currency]
type = "enum"
enum_values = ["CNY", "USD", "EUR", "GBP", "JPY"]
default = "CNY"
label = "Currency"

[fields.stage]
type = "enum"
enum_values = ["prospecting", "qualification", "proposal", "negotiation", "closed_won", "closed_lost"]
default = "prospecting"
label = "stage"

[fields.probability]
type = "integer"
min = 0
max = 100
default = 10
label = "Probability of winning an order (%)"

[fields.contact]
type = "relation"
relation_type = "many_to_one"
target = "contacts"
foreign_key = "contact_id"
label = "Associated contacts"

[fields.company]
type = "relation"
relation_type = "many_to_one"
target = "companies"
foreign_key = "company_id"
label = "Related companies"

[fields.owner_id]
type = "text"
label = "person in charge"

[fields.close_date]
type = "date"
label = "Estimated closing date"

[fields.description]
type = "richtext"
label = "describe"

[fields.loss_reason]
type = "enum"
enum_values = ["no_budget", "no_decision", "lost_to_competitor", "timing", "lack_of_fit", "other"]
label = "Reason for losing order"

[[indexes]]
fields = ["stage"]

[[indexes]]
fields = ["owner_id", "created_at"]

[[indexes]]
fields = ["company_id"]

[[indexes]]
fields = ["contact_id"]

[[indexes]]
fields = ["close_date"]

[list_view]
default_sort = "created_at:desc"
columns = ["title", "amount", "stage", "probability", "company", "contact", "owner_id", "close_date"]

[api.list]
access = "member"

[api.get]
access = "member"

[api.create]
access = "member"

[api.update]
access = "member"
filter = "@request.auth.id == owner_id || @request.auth.role == 'admin'"

[api.delete]
access = "admin"
