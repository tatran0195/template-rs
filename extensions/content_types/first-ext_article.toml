[content_type]
name = "Article"
singular = "article"
plural = "articles"
table = "articles"
description = "article"
implements = ["ownable", "timestampable"]
slug_field = "title"

[fields.title]
type = "text"
required = true
max_length = 200
label = "title"

[fields.slug]
type = "uid"
target_field = "title"
unique = true
label = "URL identifier"

[fields.content]
type = "richtext"
required = true
label = "text"

[fields.excerpt]
type = "text"
max_length = 500
label = "summary"

[fields.cover_image]
type = "media"
accept = ["image/*"]
max_count = 1
label = "cover image"

[fields.author]
type = "relation"
relation_type = "many_to_one"
target = "users"
foreign_key = "author_id"
label = "author"

[fields.category]
type = "relation"
relation_type = "many_to_one"
target = "categories"
foreign_key = "category_id"
label = "Classification"

[fields.tags]
type = "relation"
relation_type = "many_to_many"
target = "tags"
through = "articles_tags"
label = "Label"

[fields.view_count]
type = "integer"
default = 0
private = true
label = "Views"

[fields.is_pinned]
type = "boolean"
default = false
label = "Whether to pin it to the top"

[[indexes]]
fields = ["slug"]
unique = true

[[indexes]]
fields = ["status", "created_at"]

[list_view]
default_sort = "is_pinned:desc,created_at:desc"
columns = ["title", "status", "author", "category", "created_at"]

[api.list]
access = "public"
cache = true
filter = 'status = "published"'

[api.get]
access = "public"
cache = true
filter = 'status = "published"'

[api.create]
access = "admin"

[api.update]
access = "admin"

[api.delete]
access = "admin"
