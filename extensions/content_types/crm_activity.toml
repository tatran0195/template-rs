[content_type]
name = "Activity"
singular = "activity"
plural = "activities"
table = "crm_activities"
description = "Activity/Interaction Record"
implements = ["ownable", "timestampable"]

[fields.type]
type = "enum"
enum_values = ["call", "email", "meeting", "note", "task", "demo", "follow_up"]
required = true
default = "note"
label = "Activity type"

[fields.subject]
type = "text"
required = true
max_length = 300
label = "theme"

[fields.content]
type = "richtext"
label = "content"

[fields.contact]
type = "relation"
relation_type = "many_to_one"
target = "contacts"
foreign_key = "contact_id"
label = "Associated contacts"

[fields.company]
type = "relation"
relation_type = "many_to_one"
target = "companies"
foreign_key = "company_id"
label = "Related companies"

[fields.deal]
type = "relation"
relation_type = "many_to_one"
target = "deals"
foreign_key = "deal_id"
label = "Related business opportunities"

[fields.owner_id]
type = "text"
label = "person in charge"

[fields.activity_date]
type = "datetime"
required = true
label = "Activity time"

[fields.duration_minutes]
type = "integer"
min = 0
label = "Duration (minutes)"

[fields.outcome]
type = "enum"
enum_values = ["successful", "unsuccessful", "scheduled", "cancelled"]
label = "result"

[[indexes]]
fields = ["type"]

[[indexes]]
fields = ["contact_id", "activity_date"]

[[indexes]]
fields = ["company_id"]

[[indexes]]
fields = ["deal_id"]

[[indexes]]
fields = ["owner_id", "activity_date"]

[[indexes]]
fields = ["activity_date"]

[list_view]
default_sort = "activity_date:desc"
columns = ["type", "subject", "contact", "company", "deal", "activity_date", "outcome", "owner_id"]

[api.list]
access = "member"

[api.get]
access = "member"

[api.create]
access = "member"

[api.update]
access = "member"
filter = "@request.auth.id == owner_id || @request.auth.role == 'admin'"

[api.delete]
access = "member"
filter = "@request.auth.id == owner_id || @request.auth.role == 'admin'"
